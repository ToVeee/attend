<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSLG Attendance</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 30px;
        }

        h1,
        h2 {
            color: #800000;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        .box {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }

        input,
        button {
            padding: 10px;
            margin: 5px;
        }

        button {
            background: #800000;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #600000;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #800000;
            color: white;
        }

        .success {
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>SSLG Attendance System</h1>

        <!-- ADD MEMBER -->
        <div class="box">
            <h2>Add Member</h2>

            <input id="name" placeholder="Name">
            <input id="position" placeholder="Position">
            <input id="section" placeholder="Section">

            <button onclick="addMember()">Add Member</button>
        </div>


        <!-- QR SCANNER SIMULATION -->
        <div class="box">
            <h2>Attendance Scanner</h2>

            <p>
                For now, type the QR ID instead of using a camera.
            </p>

            <input id="qrInput" placeholder="Enter QR ID">

            <button onclick="scanQR()">Scan</button>

            <p id="scanResult"></p>
        </div>


        <!-- MEMBERS -->
        <div class="box">
            <h2>Members</h2>

            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Position</th>
                        <th>Section</th>
                        <th>QR ID</th>
                        <th>Attendance</th>
                    </tr>
                </thead>

                <tbody id="memberList"></tbody>
            </table>
        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
